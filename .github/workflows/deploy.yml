# ─────────────────────────────────────────────────────────────
# main 에 push 되면
#   1) validate : 코드·compose 문법 검사 (깨진 코드는 이미지로 만들지 않음)
#   2) build    : Docker Hub 에 이미지 푸시 — 태그 2개 (latest, 커밋 SHA)
#   3) deploy   : SSH 로 서버 접속
#                 → 현재 돌고 있는 이미지 백업 → 새 SHA 이미지 pull → 컨테이너 교체
#                 → http://localhost/health 재시도 헬스체크
#                 → 끝까지 실패하면 백업한 이미지로 자동 롤백 + 워크플로 실패(exit 1)
#
# 모든 명령은 Docker Compose v2 (`docker compose`) 기준.
# 서버의 .env 는 업로드·수정·삭제하지 않음 (이미지 태그는 셸 환경변수로만 전달).
# 필요한 Secrets 와 서버 사전 준비는 README.md 의 "배포 (GitHub Actions)" 참고.
# ─────────────────────────────────────────────────────────────

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

# 배포가 겹치면 앞의 배포가 끝날 때까지 대기 (교체 중간에 끊기지 않게)
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: secure-memo

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Python syntax check
        run: python3 -m py_compile app.py

      - name: docker compose config check
        # 실제 값이 아닌 검사용 더미 값 (compose 의 필수 변수 검사 통과용)
        env:
          MARIADB_ROOT_PASSWORD: dummy
          MARIADB_DATABASE: dummy
          MARIADB_USER: dummy
          MARIADB_PASSWORD: dummy
          JWT_SECRET_KEY: dummy
          CSRF_SECRET_KEY: dummy
          SEED_PASSWORD: dummy
          SEED_GITHUB_ID: dummy
        run: docker compose config --quiet

  build:
    name: Build & push image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 서버가 Intel(amd64)이든 ARM(arm64, 예: Oracle Ampere)이든 그대로 돌도록 두 아키텍처로 빌드
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (latest + commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 서버에는 소스 없이 compose 파일과 nginx 설정만 필요.
      # source 에 .env 가 없으므로 서버의 .env 는 절대 덮어쓰지 않음 (rm: false → 기존 파일 삭제도 안 함)
      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: "docker-compose.yml,nginx.conf"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          rm: false

      - name: Backup current image, deploy new one, health check, rollback on failure
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          NEW_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/secure-memo
          NEW_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,NEW_IMAGE,NEW_TAG
          command_timeout: 15m
          script: |
            set -eu
            cd "$DEPLOY_PATH"

            # ── 0. 사전 확인 ─────────────────────────────────────
            if [ ! -f .env ]; then
              echo "::error::$DEPLOY_PATH/.env 가 없습니다. 서버에 먼저 만들어 주세요 (README 체크리스트)."
              exit 1
            fi
            # .env 는 이 스크립트가 절대 수정하지 않음 → 끝에서 해시를 비교해 확인
            ENV_HASH_BEFORE=$(sha256sum .env | cut -d' ' -f1)
            check_env_untouched() {
              if [ "$(sha256sum .env | cut -d' ' -f1)" != "$ENV_HASH_BEFORE" ]; then
                echo "::error::배포 중 .env 가 바뀌었습니다. 확인이 필요합니다."
                exit 1
              fi
              echo ".env 변경 없음 확인"
            }

            # 헬스체크: 컨테이너가 막 뜬 직후엔 실패할 수 있어 5초 간격 10회 재시도 (최대 약 1분)
            health_check() {
              for i in $(seq 1 10); do
                if curl -fsS --max-time 3 http://localhost/health >/dev/null; then
                  echo "헬스체크 성공 ($i/10)"
                  return 0
                fi
                echo "헬스체크 실패 ($i/10) - 5초 후 재시도"
                sleep 5
              done
              return 1
            }

            # ── 1. 현재 돌고 있는 이미지 백업 (롤백용) ───────────
            PREV_IMAGE=$(docker inspect -f '{{.Config.Image}}' memo-app 2>/dev/null || true)
            if [ -n "$PREV_IMAGE" ]; then
              echo "$PREV_IMAGE" > .prev_image
              echo "현재 이미지 백업: $PREV_IMAGE"
            else
              echo "실행 중인 앱 컨테이너 없음 (첫 배포) - 롤백 대상 없음"
            fi

            # ── 2. 새 이미지 pull (비공개 레포여도 되게 로그인 → pull → 바로 로그아웃) ──
            export APP_IMAGE="$NEW_IMAGE"
            export IMAGE_TAG="$NEW_TAG"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose pull app nginx
            docker logout

            # ── 3. 컨테이너 교체 ────────────────────────────────
            # DB 는 설정이 바뀐 경우에만 다시 만듦 (매 배포마다 DB 재시작 방지, 데이터는 볼륨에 유지)
            if ! docker compose up -d --no-build db; then
              echo "::error::DB 컨테이너를 띄우지 못했습니다 (앱은 교체하지 않음, 기존 서비스 유지)"
              docker compose logs --tail=50 db || true
              exit 1
            fi
            # app / nginx 는 강제 재생성 → 이름·포트 충돌 없이 교체
            # (새 app 이 unhealthy 면 up 자체가 실패할 수 있으므로, 여기서 멈추지 말고 헬스체크로 판정)
            if ! docker compose up -d --no-build --force-recreate --remove-orphans app nginx; then
              echo "::warning::docker compose up 이 실패를 반환함 - 헬스체크로 최종 판정"
            fi

            # ── 4. 헬스체크 ─────────────────────────────────────
            if health_check; then
              # 서버에서 직접 compose 명령을 칠 때 쓸 수 있게 현재 이미지 기록 (.env 와 별도 파일)
              printf 'APP_IMAGE=%s\nIMAGE_TAG=%s\n' "$APP_IMAGE" "$IMAGE_TAG" > image.env
              docker image prune -af --filter "until=72h"   # 3일 지난 미사용 이미지만 정리 (볼륨은 안 건드림)
              docker compose ps
              check_env_untouched
              echo "배포 완료: $APP_IMAGE:$IMAGE_TAG"
              exit 0
            fi

            # ── 5. 실패 → 자동 롤백 ─────────────────────────────
            echo "::error::새 버전($APP_IMAGE:$IMAGE_TAG) 헬스체크 최종 실패"
            docker compose logs --tail=100 app || true

            if [ -z "$PREV_IMAGE" ]; then
              echo "::error::이전 이미지가 없어 롤백할 수 없습니다 (첫 배포). 위 로그를 확인하세요."
              check_env_untouched
              exit 1
            fi

            echo "이전 이미지로 롤백: $PREV_IMAGE"
            export APP_IMAGE="${PREV_IMAGE%:*}"
            export IMAGE_TAG="${PREV_IMAGE##*:}"
            docker compose up -d --no-build --force-recreate --remove-orphans app nginx || true
            if health_check; then
              printf 'APP_IMAGE=%s\nIMAGE_TAG=%s\n' "$APP_IMAGE" "$IMAGE_TAG" > image.env
              echo "::warning::롤백 완료 - 이전 버전($PREV_IMAGE)으로 서비스 중"
            else
              echo "::error::롤백 후에도 헬스체크 실패 - 서버에서 직접 확인이 필요합니다"
            fi
            check_env_untouched
            exit 1   # 새 버전 배포는 실패했으므로 워크플로는 실패 처리
