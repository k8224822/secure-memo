# ── Nginx 리버스 프록시 (외부 노출은 이 컨테이너의 80 포트뿐) ──
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;                 # 응답에 Nginx 버전 숨김
    sendfile      on;
    keepalive_timeout 30s;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # 요청 크기·타임아웃 제한 (Flask MAX_CONTENT_LENGTH 16KB 와 맞춤)
    client_max_body_size    16k;
    client_body_timeout     10s;
    client_header_timeout   10s;
    send_timeout            10s;

    # JWT 쿠키 + CSRF 쿠키 + 커스텀 헤더가 들어와도 요청 헤더가 잘리지 않게 버퍼 확보
    large_client_header_buffers 4 16k;
    # 보안 헤더는 전부 하이픈 이름(X-CSRF-Token 등)이라 그대로 통과. 밑줄(_) 헤더는 버림(기본값, 헤더 위장 방지)
    # → 커스텀 헤더를 새로 만들 땐 X_CSRF_Token 처럼 밑줄을 쓰면 Flask 까지 안 가니 주의
    underscores_in_headers off;
    ignore_invalid_headers on;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # 로그인 무차별 대입 완화: IP당 초당 5회
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
    limit_req_status 429;

    # Flask 컨테이너 (서비스명 app, frontend-net 에서만 보임. DB 는 이 네트워크에 없음)
    upstream flask_app {
        server app:5000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # ── Flask 로 넘길 헤더 (location 에서 proxy_set_header 를 따로 쓰지 않아 모든 location 이 상속) ──
        proxy_http_version 1.1;
        proxy_pass_request_headers on;      # 클라이언트 요청 헤더 전체 전달 (기본값이지만 명시)

        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;      # 클라이언트가 위조한 값은 덮어씀
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;

        # 쿠키(access_token, csrf_token)와 보안 커스텀 헤더를 그대로 전달
        proxy_set_header Cookie              $http_cookie;
        proxy_set_header Origin              $http_origin;
        proxy_set_header X-CSRF-Token        $http_x_csrf_token;
        proxy_set_header X-Request-Nonce     $http_x_request_nonce;
        proxy_set_header X-Request-Timestamp $http_x_request_timestamp;

        # 응답 쪽: Flask 의 Set-Cookie(HttpOnly·SameSite·Path)와 보안 헤더(CSP 등)를 건드리지 않음
        # (proxy_hide_header / proxy_cookie_path 를 쓰지 않음)
        proxy_buffer_size 16k;              # 긴 Set-Cookie 헤더가 들어와도 502 나지 않게
        proxy_buffers 8 16k;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        location = /api/login {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://flask_app;
        }

        location = /health {
            access_log off;                 # 헬스체크 요청은 로그에서 제외
            proxy_pass http://flask_app;
        }

        location / {
            proxy_pass http://flask_app;
        }

        # 숨김 파일(.env, .git 등) 요청 차단
        location ~ /\. {
            return 404;
        }
    }
}
