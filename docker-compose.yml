# ── Nginx - Flask - MariaDB 3-Tier ──
#
#   [인터넷] ──:80──> nginx ──(frontend-net)──> app ──(backend-net, internal)──> db
#
#   - 외부 공개 포트: nginx 80 하나뿐
#   - nginx 는 frontend-net 에만 있으므로 db 에 도달할 네트워크 경로 자체가 없음
#   - db 는 ports 없음 + backend-net(internal) 이라 호스트·인터넷 모두 차단
#
# 로컬:  docker compose up -d --build                         (이미지를 직접 빌드)
# 서버:  APP_IMAGE / IMAGE_TAG 를 셸 환경변수로 주고 pull 후 up  (3단계 GitHub Actions 가 수행)
#        → 서버의 .env 는 건드리지 않음. 롤백 = 이전 IMAGE_TAG 로 다시 up

# 프로젝트 이름 고정 → 어느 폴더에서 실행해도 컨테이너·네트워크·볼륨 이름이 같아 충돌 없음
name: secure-memo

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: memo-nginx
    ports:
      - "80:80"                        # 외부에 열리는 유일한 포트
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net                   # backend-net 에 없음 → DB 접근 불가
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    build: .
    # 이미지 태그를 환경변수로 받음 → 배포는 커밋 SHA, 롤백은 이전 SHA 로 같은 파일 재사용
    # 로컬 기본값: secure-memo-app:latest / 서버: <도커허브ID>/secure-memo:<커밋SHA>
    image: ${APP_IMAGE:-secure-memo-app}:${IMAGE_TAG:-latest}
    container_name: memo-app
    expose:
      - "5000"                         # 컨테이너 네트워크 안에서만 (호스트 포트 없음)
    environment:
      # Flask 에 필요한 값만 골라서 전달 (DB root 비밀번호는 전달하지 않음)
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MARIADB_DATABASE:?MARIADB_DATABASE 를 .env 에 설정하세요}
      DB_USER: ${MARIADB_USER:?MARIADB_USER 를 .env 에 설정하세요}
      DB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD 를 .env 에 설정하세요}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 를 .env 에 설정하세요}
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY:?CSRF_SECRET_KEY 를 .env 에 설정하세요}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REPLAY_WINDOW_SECONDS: ${REPLAY_WINDOW_SECONDS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      TRUST_PROXY: "true"              # Nginx 의 X-Forwarded-* 를 1단계만 신뢰
      SEED_USERNAME: ${SEED_USERNAME:-tester}
      SEED_PASSWORD: ${SEED_PASSWORD:?SEED_PASSWORD 를 .env 에 설정하세요}
      SEED_DISPLAY_NAME: ${SEED_DISPLAY_NAME:-유형환}
      SEED_GITHUB_ID: ${SEED_GITHUB_ID:?SEED_GITHUB_ID 를 .env 에 설정하세요}
      INIT_DB_ON_STARTUP: "true"
    networks:
      - frontend-net                   # nginx 와 통신
      - backend-net                    # db 와 통신
    depends_on:
      db:
        condition: service_healthy     # DB 가 실제로 쿼리를 받을 수 있을 때만 Flask 기동
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    read_only: true                    # 컨테이너 파일시스템 변경 불가 (코드 변조 방지)
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db:
    image: mariadb:11.4
    container_name: memo-db
    # ports 설정 없음 (의도적): 호스트·외부에서 3306 접근 불가
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD 를 .env 에 설정하세요}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?MARIADB_DATABASE 를 .env 에 설정하세요}
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER 를 .env 에 설정하세요}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD 를 .env 에 설정하세요}
      MARIADB_AUTO_UPGRADE: "1"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql   # Named Volume: 컨테이너를 지워도 메모 유지
    networks:
      - backend-net                    # app 하고만 연결
    healthcheck:
      # 앱 계정으로 TCP(127.0.0.1) ping. 최초 초기화 중 임시 서버는 네트워크를 끄고 뜨기 때문에
      # 초기화가 끝나 실제 서버가 뜬 뒤에만 healthy 가 됨. 비밀번호는 MYSQL_PWD 로 넘겨 ps 에 안 보이게.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MARIADB_PASSWORD\" mariadb-admin ping -h 127.0.0.1 -u \"$$MARIADB_USER\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s                # 첫 기동(볼륨 초기화)은 오래 걸리므로 넉넉하게
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true                     # 외부(인터넷·호스트)로 나가는 경로가 없는 내부 전용 네트워크

volumes:
  mariadb-data:
